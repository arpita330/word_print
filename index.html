<!DOCTYPE html>
<html>
<head>
    <title>URL Text Printer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        
        .card-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .preview {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        .preview img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 5px;
        }
        
        .text-overlay {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 42px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
            padding: 15px 30px;
            border-radius: 10px;
            letter-spacing: 2px;
            text-align: center;
            width: 80%;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
        }
        
        .info {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
        
        .download-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin: 20px auto;
            width: fit-content;
        }
        
        .download-btn:hover {
            background: #0b7dda;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="preview" id="preview">
            <img id="baseImage" src="https://raw.githubusercontent.com/arpita330/word_print/main/IMG_20260215_144053_492.jpg" alt="Background Image" crossorigin="anonymous">
            <div class="text-overlay" id="textOverlay"></div>
        </div>
        
        <button class="download-btn" onclick="downloadImage()">📥 Download Image</button>
        <div class="info">Text is loaded from URL: <code>?print=Your_Text_Here</code></div>
    </div>

    <script>
        // Get text from URL parameter
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // Load text from URL when page loads
        window.addEventListener('load', function() {
            const printText = getUrlParameter('print');
            const textOverlay = document.getElementById('textOverlay');
            
            if (printText) {
                // Replace underscores with spaces
                const decodedText = printText.replace(/_/g, ' ');
                textOverlay.textContent = decodedText;
            } else {
                textOverlay.textContent = 'No text provided';
            }
        });
        
        // Download function
        async function downloadImage() {
            const downloadBtn = document.querySelector('.download-btn');
            const originalText = downloadBtn.textContent;
            downloadBtn.textContent = 'Generating...';
            downloadBtn.disabled = true;
            
            try {
                const canvas = await html2canvas(document.getElementById('preview'), {
                    scale: 2,
                    backgroundColor: null,
                    allowTaint: true,
                    useCORS: true,
                    logging: false
                });
                
                const blob = await new Promise(resolve => {
                    canvas.toBlob(resolve, 'image/png');
                });
                
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'printed_text.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error generating image. Please try again.');
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.textContent = originalText;
            }
        }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
