<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Card Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .preview {
            position: relative;
            margin-bottom: 30px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .preview img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .text-overlay {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 42px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.6);
            padding: 15px 30px;
            border-radius: 10px;
            letter-spacing: 2px;
            text-align: center;
            width: 80%;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            backdrop-filter: blur(5px);
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
        }
        
        .btn-info {
            background: #4299e1;
            color: white;
        }
        
        .btn-info:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }
        
        .error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }
        
        .loader {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .text-overlay {
                font-size: 28px;
                padding: 10px 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎁 Gift Card Generator</h1>
            
            <div class="preview" id="preview">
                <img id="baseImage" 
                     src="https://raw.githubusercontent.com/arpita330/word_print/main/IMG_20260215_144053_492.jpg" 
                     alt="Gift Card Background" 
                     crossorigin="anonymous">
                <div class="text-overlay" id="codeOverlay">GIFT-CODE</div>
            </div>
            
            <div class="controls">
                <div class="input-group">
                    <input type="text" 
                           id="giftCode" 
                           placeholder="Enter gift code (A-Z, 0-9, hyphens)" 
                           maxlength="50"
                           pattern="[A-Za-z0-9-_]+">
                </div>
                
                <div class="button-group">
                    <button class="btn-info" onclick="generateViaAPI()">
                        🔄 Generate via API
                    </button>
                    <button class="btn-success" onclick="downloadImage()">
                        💾 Download
                    </button>
                </div>
                
                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <p>Generating your gift card...</p>
                </div>
                
                <div class="message success" id="successMessage"></div>
                <div class="message error" id="errorMessage"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        // Configuration
        const API_BASE_URL = window.location.origin;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            const giftCodeInput = document.getElementById('giftCode');
            
            // Real-time preview update
            giftCodeInput.addEventListener('input', function() {
                const code = this.value.trim();
                document.getElementById('codeOverlay').textContent = code || 'GIFT-CODE';
            });
            
            // Load config from API
            fetchConfig();
        });
        
        async function fetchConfig() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/config`);
                const config = await response.json();
                console.log('Config loaded:', config);
            } catch (error) {
                console.log('Config API not available, using defaults');
            }
        }
        
        function showMessage(type, message) {
            const successEl = document.getElementById('successMessage');
            const errorEl = document.getElementById('errorMessage');
            
            successEl.style.display = 'none';
            errorEl.style.display = 'none';
            
            if (type === 'success') {
                successEl.textContent = '✅ ' + message;
                successEl.style.display = 'block';
            } else {
                errorEl.textContent = '❌ ' + message;
                errorEl.style.display = 'block';
            }
            
            setTimeout(() => {
                successEl.style.display = 'none';
                errorEl.style.display = 'none';
            }, 5000);
        }
        
        function showLoader() {
            document.getElementById('loader').style.display = 'block';
        }
        
        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }
        
        async function generateViaAPI() {
            const code = document.getElementById('giftCode').value.trim();
            
            if (!code || code.length < 3) {
                showMessage('error', 'Please enter a valid code (minimum 3 characters)');
                return;
            }
            
            showLoader();
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/generate-card`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ code })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to generate card');
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                
                // Update preview
                document.getElementById('baseImage').src = url;
                
                // Trigger download
                const a = document.createElement('a');
                a.href = url;
                a.download = `gift_card_${code.replace(/[^a-zA-Z0-9]/g, '_')}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                showMessage('success', 'Gift card generated successfully!');
            } catch (error) {
                console.error('Error:', error);
                showMessage('error', 'Failed to generate via API. Trying client-side method...');
                await downloadImage();
            } finally {
                hideLoader();
            }
        }
        
        async function downloadImage() {
            const preview = document.getElementById('preview');
            const code = document.getElementById('giftCode').value.trim();
            
            if (!code) {
                showMessage('error', 'Please enter a gift code first');
                return;
            }
            
            showLoader();
            
            try {
                if (typeof html2canvas === 'undefined') {
                    throw new Error('html2canvas library not loaded');
                }
                
                const canvas = await html2canvas(preview, {
                    scale: 2,
                    backgroundColor: null,
                    allowTaint: false,
                    useCORS: true,
                    logging: false
                });
                
                canvas.toBlob(async function(blob) {
                    // Download locally
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `gift_card_${code.replace(/[^a-zA-Z0-9]/g, '_')}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    
                    // Try to save to server
                    try {
                        const formData = new FormData();
                        formData.append('image', blob, 'gift_card.png');
                        formData.append('code', code);
                        
                        const response = await fetch(`${API_BASE_URL}/save-gift-image`, {
                            method: 'POST',
                            body: formData
                        });
                        
                        if (response.ok) {
                            const data = await response.json();
                            if (data.success) {
                                showMessage('success', `Gift card saved! URL: ${data.data.imageUrl}`);
                            }
                        }
                    } catch (serverError) {
                        console.log('Server save not available, local download successful');
                    }
                    
                    showMessage('success', 'Gift card downloaded successfully!');
                    hideLoader();
                    
                }, 'image/png');
                
            } catch (error) {
                console.error('Error:', error);
                showMessage('error', 'Failed to generate image: ' + error.message);
                hideLoader();
            }
        }
    </script>
</body>
  </html>
